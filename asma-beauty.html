<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asma Beauty — Larache</title>
<style>

  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Jost:wght@300;400;500;600&family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap');
  body{margin:0;background:#0b0a09;font-family:'Jost','Tajawal',system-ui,sans-serif;}
  a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent;}
  ::selection{background:#c9a15a;color:#0e0d0b;}

  @keyframes glow { from{opacity:.6;transform:translate(-50%,0) scale(1);} to{opacity:1;transform:translate(-50%,0) scale(1.08);} }
  @keyframes fadeUp { from{opacity:0;transform:translateY(14px);} to{opacity:1;transform:none;} }
  @keyframes fadeIn { from{opacity:0;transform:scale(.94);} to{opacity:1;transform:none;} }

  .enter{opacity:0;animation:fadeUp .7s cubic-bezier(.2,.7,.2,1) forwards;}
  .logo{opacity:0;animation:fadeIn .9s cubic-bezier(.2,.7,.2,1) forwards;}

  .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;box-sizing:border-box;padding:17px;border-radius:3px;font-size:14px;letter-spacing:2px;text-transform:uppercase;transition:transform .12s ease, background-color .2s ease, box-shadow .2s ease;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:#c9a15a;color:#0e0d0b;font-weight:500;box-shadow:0 6px 24px rgba(201,161,90,.25);}
  .btn-primary:active{background:#b58c46;}
  .btn-ghost{border:1px solid #c9a15a;color:#c9a15a;}
  .btn-ghost:active{background:rgba(201,161,90,.12);}

  .icons{display:flex;justify-content:center;gap:36px;width:100%;}
  .icon{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#cfc4a8;}
  .icon .circle{width:52px;height:52px;border-radius:50%;border:1px solid #5a5446;display:flex;align-items:center;justify-content:center;color:#c9a15a;transition:transform .12s ease, background-color .2s ease, border-color .2s ease;}
  .icon:active .circle{transform:scale(.92);background:rgba(201,161,90,.14);border-color:#c9a15a;}

  .sep{width:100%;height:1px;background:linear-gradient(90deg,transparent,#5a5446,transparent);margin:36px 0;}
  .h2{font-family:'Cormorant Garamond','Amiri',serif;font-size:22px;letter-spacing:3px;color:#c9a15a;text-transform:uppercase;text-align:center;margin:0 0 20px;font-weight:500;}

  .cat{border:1px solid #2c271f;border-radius:4px;background:rgba(20,18,15,.72);margin-bottom:10px;overflow:hidden;}
  .cat-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#f3ecdf;border-inline-start:2px solid #c9a15a;transition:background-color .2s ease;}
  .rows{padding:4px 18px 12px;}
  .row{display:flex;align-items:baseline;gap:10px;padding:11px 0;}
  .row + .row{border-top:1px solid #241f18;}
  .svc{font-size:15px;color:#ece4d4;}
  .dots{flex:1;border-bottom:1px dotted #4a4538;transform:translateY(-4px);}
  .price{font-size:14px;color:#c9a15a;font-weight:500;white-space:nowrap;}


  .lang{position:absolute;top:16px;right:16px;z-index:3;display:flex;gap:2px;padding:3px;border:1px solid #3a352b;border-radius:999px;background:rgba(14,13,11,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);direction:ltr;}
  .lang a{min-width:34px;height:28px;padding:0 8px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;border-radius:999px;font-size:11px;letter-spacing:1px;color:#cfc4a8;cursor:pointer;transition:background-color .2s ease,color .2s ease;}
  .lang a.on{background:#c9a15a;color:#0e0d0b;font-weight:600;}
  .lang a.ar{font-family:'Tajawal',sans-serif;font-size:13px;letter-spacing:0;}
  .rtl, .rtl *{letter-spacing:0 !important;}
  .rtl .tag{font-style:normal !important;font-size:21px !important;}
  .rtl .svc{font-size:16px;}
  .rtl .cat-head{font-size:15px;}
  .rtl .btn{font-size:16px;}
  .rtl .icon{font-size:13px;}

  @media (prefers-reduced-motion: reduce){
    .enter,.logo{animation:none;opacity:1;}
    .halo{animation:none;}
  }

</style>
</head>

  <div class="lang">
    <a class="on" id="btn-fr" onclick="setLang('fr')">FR</a>

    head.innerHTML = '<span>' + cat.name + '</span>';
    catDiv.appendChild(head);
    const rows = document.createElement('div');
    rows.className = 'rows';
    cat.items.forEach(it => {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = '<span class="svc">' + it + '</span><span class="dots"></span><span class="price">' + priceLabel + '</span>';
      rows.appendChild(row);
    });
    catDiv.appendChild(rows);
    container.appendChild(catDiv);
  });
}

function setLang(lang){
  const t = T[lang] || T.fr;
  document.getElementById('root').setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
  document.getElementById('root').className = lang === 'ar' ? 'rtl' : '';
  document.getElementById('t-city').textContent = t.city;
  document.getElementById('t-city2').textContent = t.city;
  document.getElementById('t-tagline').textContent = t.tagline;
  document.getElementById('t-book').textContent = t.book;
  document.getElementById('t-call').textContent = t.call;
  document.getElementById('t-map').textContent = t.map;
  document.getElementById('t-services').textContent = t.services;
  document.getElementById('t-hours').textContent = t.hours;
  document.getElementById('t-hours1').textContent = t.hours1;
  document.getElementById('t-hours2').textContent = t.hours2;
  document.getElementById('wa-btn').setAttribute('href', 'https://wa.me/212610068187?text=' + encodeURIComponent(t.wa));
  renderSvc(t.cats, t.price);

  document.getElementById('btn-fr').className = lang === 'fr' ? 'on' : '';
  document.getElementById('btn-en').className = lang === 'en' ? 'on' : '';
  document.getElementById('btn-ar').className = 'ar' + (lang === 'ar' ? ' on' : '');

  try { localStorage.setItem('asma-lang', lang); } catch(e) {}
}

document.addEventListener('DOMContentLoaded', function(){
  let lang = 'fr';
  try {
    const saved = localStorage.getItem('asma-lang');
    const nav = (navigator.language || '').slice(0,2);
    lang = saved || (nav === 'ar' ? 'ar' : nav === 'en' ? 'en' : 'fr');
  } catch(e) {}
  setLang(lang);
});

</script>
